<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="760" viewBox="0 0 1920 760" role="img" aria-labelledby="title desc">
  <title id="title">SGF-SGAligner v0.1.0 research pipeline</title>
  <desc id="desc">Prepared scene graphs and local point clouds pass through canonical adaptation, multimodal graph alignment, candidate matching, geometric registration, and a fail-closed safety decision to produce a fused PLY candidate.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="inputCard" x1="0" x2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="outputCard" x1="0" x2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#f7fee7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .stage-id { font: 700 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; fill: #475569; }
      .stage-title { font: 700 20px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .stage-copy { font: 500 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 600 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .lane-title { font: 700 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .lane-copy { font: 500 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .pill { font: 700 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="760" fill="url(#bg)"/>
  <rect x="28" y="24" width="1864" height="712" rx="28" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>

  <text x="70" y="76" class="title">SGF-SGAligner · v0.1.0 Research Preview</text>
  <text x="70" y="106" class="subtitle">Scene-graph-driven multi-scan alignment and safety-gated 3D registration</text>
  <rect x="1509" y="53" width="332" height="42" rx="21" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1675" y="79" text-anchor="middle" class="pill" fill="#c2410c">PREPARED GRAPH + CLOUD BACKEND</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect x="65" y="154" width="215" height="410" rx="24" fill="url(#inputCard)" stroke="#93c5fd" stroke-width="2"/>
  </g>
  <text x="88" y="186" class="stage-id">INPUT</text>
  <text x="88" y="218" class="stage-title">Prepared SGF/InSeg</text>

  <rect x="88" y="242" width="169" height="132" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="106" y="270" class="small">SCENE GRAPH</text>
  <line x1="137" y1="315" x2="190" y2="286" stroke="#64748b" stroke-width="2"/>
  <line x1="137" y1="315" x2="211" y2="340" stroke="#64748b" stroke-width="2"/>
  <line x1="190" y1="286" x2="226" y2="318" stroke="#64748b" stroke-width="2"/>
  <line x1="211" y1="340" x2="226" y2="318" stroke="#64748b" stroke-width="2"/>
  <circle cx="137" cy="315" r="15" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
  <circle cx="190" cy="286" r="13" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <circle cx="226" cy="318" r="14" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="211" cy="340" r="12" fill="#34d399" stroke="#059669" stroke-width="2"/>

  <rect x="88" y="394" width="169" height="137" rx="16" fill="#0f172a" stroke="#334155"/>
  <text x="106" y="422" class="small" fill="#cbd5e1">LOCAL POINT CLOUD</text>
  <g fill="#7dd3fc" opacity="0.92">
    <circle cx="117" cy="478" r="3"/><circle cx="126" cy="458" r="3"/><circle cx="139" cy="489" r="3"/>
    <circle cx="148" cy="448" r="3"/><circle cx="155" cy="474" r="3"/><circle cx="166" cy="496" r="3"/>
    <circle cx="176" cy="453" r="3"/><circle cx="186" cy="481" r="3"/><circle cx="198" cy="441" r="3"/>
    <circle cx="207" cy="471" r="3"/><circle cx="218" cy="496" r="3"/><circle cx="230" cy="459" r="3"/>
    <circle cx="119" cy="505" r="3"/><circle cx="145" cy="512" r="3"/><circle cx="193" cy="510" r="3"/>
    <circle cx="235" cy="514" r="3"/><circle cx="220" cy="430" r="3"/><circle cx="132" cy="432" r="3"/>
  </g>
  <text x="172" y="550" text-anchor="middle" class="small">objects · relations · regions</text>

  <!-- Stage 1 -->
  <path d="M280 360 H329" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="335" y="190" width="235" height="322" rx="24" fill="#dff7f0" stroke="#4da88e" stroke-width="3"/>
  </g>
  <text x="360" y="222" class="stage-id">01 · NORMALIZE</text>
  <text x="360" y="258" class="stage-title">Canonical Adapter</text>
  <rect x="360" y="283" width="185" height="48" rx="10" fill="#ffffff" stroke="#86cbb7"/>
  <text x="452" y="312" text-anchor="middle" class="stage-copy">Object / relation mapping</text>
  <rect x="360" y="344" width="185" height="48" rx="10" fill="#ffffff" stroke="#86cbb7"/>
  <text x="452" y="373" text-anchor="middle" class="stage-copy">512-point region tensors</text>
  <rect x="360" y="405" width="185" height="48" rx="10" fill="#ffffff" stroke="#86cbb7"/>
  <text x="452" y="434" text-anchor="middle" class="stage-copy">IDs · units · provenance</text>
  <text x="452" y="482" text-anchor="middle" class="small">deterministic input contract</text>

  <!-- Stage 2 -->
  <path d="M570 360 H619" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="625" y="160" width="255" height="382" rx="24" fill="#e8e7ff" stroke="#7770c8" stroke-width="3"/>
  </g>
  <text x="650" y="194" class="stage-id">02 · ALIGN</text>
  <text x="650" y="230" class="stage-title">Multimodal Graph</text>
  <text x="650" y="254" class="stage-title">Alignment</text>
  <rect x="650" y="282" width="205" height="50" rx="11" fill="#ffffff" stroke="#aaa5df"/>
  <text x="752" y="312" text-anchor="middle" class="stage-copy">Point-region encoder</text>
  <rect x="650" y="345" width="205" height="50" rx="11" fill="#ffffff" stroke="#aaa5df"/>
  <text x="752" y="375" text-anchor="middle" class="stage-copy">Relation + graph context</text>
  <rect x="650" y="408" width="205" height="50" rx="11" fill="#ffffff" stroke="#aaa5df"/>
  <text x="752" y="438" text-anchor="middle" class="stage-copy">Cross-scan embeddings</text>
  <g transform="translate(688 486)">
    <rect x="0" y="0" width="28" height="22" rx="5" fill="#60a5fa"/>
    <rect x="36" y="0" width="28" height="22" rx="5" fill="#34d399"/>
    <rect x="72" y="0" width="28" height="22" rx="5" fill="#fbbf24"/>
    <rect x="108" y="0" width="28" height="22" rx="5" fill="#f472b6"/>
  </g>

  <!-- Stage 3 -->
  <path d="M880 360 H929" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="935" y="190" width="220" height="322" rx="24" fill="#fff1df" stroke="#e59a3a" stroke-width="3"/>
  </g>
  <text x="960" y="222" class="stage-id">03 · MATCH</text>
  <text x="960" y="258" class="stage-title">Candidate Matching</text>
  <text x="960" y="300" class="stage-copy">Top-k object pairs</text>
  <text x="960" y="326" class="stage-copy">Mutual and rank evidence</text>
  <text x="960" y="352" class="stage-copy">Rigid-consistency clusters</text>
  <g transform="translate(974 385)">
    <circle cx="18" cy="18" r="13" fill="#60a5fa"/>
    <circle cx="18" cy="58" r="13" fill="#34d399"/>
    <circle cx="18" cy="98" r="13" fill="#fbbf24"/>
    <circle cx="128" cy="18" r="13" fill="#60a5fa"/>
    <circle cx="128" cy="58" r="13" fill="#34d399"/>
    <circle cx="128" cy="98" r="13" fill="#f472b6"/>
    <line x1="32" y1="18" x2="114" y2="18" stroke="#2563eb" stroke-width="4"/>
    <line x1="32" y1="58" x2="114" y2="58" stroke="#059669" stroke-width="4"/>
    <line x1="32" y1="98" x2="114" y2="58" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  </g>

  <!-- Stage 4 -->
  <path d="M1155 360 H1204" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1210" y="160" width="250" height="382" rx="24" fill="#dff2ff" stroke="#4b9bc8" stroke-width="3"/>
  </g>
  <text x="1235" y="194" class="stage-id">04 · REGISTER</text>
  <text x="1235" y="230" class="stage-title">Geometric Registration</text>
  <rect x="1235" y="268" width="200" height="48" rx="11" fill="#ffffff" stroke="#8bc4e5"/>
  <text x="1335" y="298" text-anchor="middle" class="stage-copy">GeoTransformer</text>
  <rect x="1235" y="330" width="200" height="48" rx="11" fill="#ffffff" stroke="#8bc4e5"/>
  <text x="1335" y="360" text-anchor="middle" class="stage-copy">Weighted RANSAC</text>
  <rect x="1235" y="392" width="200" height="48" rx="11" fill="#ffffff" stroke="#8bc4e5"/>
  <text x="1335" y="422" text-anchor="middle" class="stage-copy">Forward / reverse ICP</text>
  <text x="1335" y="479" text-anchor="middle" class="small">multiple rigid hypotheses</text>
  <path d="M1260 506 C1290 478 1314 531 1342 501 C1368 473 1396 522 1422 492" fill="none" stroke="#0284c7" stroke-width="4"/>

  <!-- Stage 5 -->
  <path d="M1460 360 H1509" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1515" y="190" width="225" height="322" rx="24" fill="#ffe4df" stroke="#d57362" stroke-width="3"/>
  </g>
  <text x="1540" y="222" class="stage-id">05 · DECIDE</text>
  <text x="1540" y="258" class="stage-title">Safety Decision</text>
  <text x="1540" y="300" class="stage-copy">Overlap and inliers</text>
  <text x="1540" y="326" class="stage-copy">Residual and motion</text>
  <text x="1540" y="352" class="stage-copy">Reverse / cycle agreement</text>
  <rect x="1540" y="382" width="175" height="52" rx="13" fill="#ffffff" stroke="#eaa59a"/>
  <path d="M1572 408 l13 13 l28 -31" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1650" y="413" text-anchor="middle" class="stage-copy">RegistrationDecision</text>
  <text x="1627" y="474" text-anchor="middle" class="small">fail closed on uncertainty</text>

  <!-- Outputs -->
  <path d="M1740 328 H1798" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="1806" y="238" width="70" height="174" rx="18" fill="url(#outputCard)" stroke="#65a30d" stroke-width="2"/>
  <text x="1841" y="269" text-anchor="middle" class="stage-id" fill="#3f6212">OUTPUT</text>
  <g transform="translate(1818 292)" fill="#4ade80" opacity="0.9">
    <circle cx="10" cy="42" r="3"/><circle cx="18" cy="24" r="3"/><circle cx="26" cy="53" r="3"/>
    <circle cx="34" cy="17" r="3"/><circle cx="42" cy="43" r="3"/><circle cx="48" cy="66" r="3"/>
    <circle cx="15" cy="72" r="3"/><circle cx="31" cy="81" r="3"/><circle cx="49" cy="91" r="3"/>
  </g>
  <text x="1841" y="385" text-anchor="middle" class="small" fill="#3f6212">Fused PLY</text>

  <path d="M1684 512 V553 H1798" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>
  <rect x="1806" y="529" width="70" height="52" rx="14" fill="#fef2f2" stroke="#ef4444"/>
  <text x="1841" y="560" text-anchor="middle" class="pill" fill="#b91c1c">REJECT</text>

  <!-- Audit lane -->
  <rect x="335" y="610" width="1541" height="84" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7"/>
  <circle cx="378" cy="652" r="19" fill="#334155"/>
  <path d="M369 652 l7 7 l12 -16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="413" y="646" class="lane-title">Reproducibility &amp; Runtime Audit</text>
  <text x="413" y="672" class="lane-copy">preregistration · SHA-256 manifests · sealed inputs · deterministic seeds · exact execution receipts</text>
  <rect x="1450" y="631" width="390" height="42" rx="21" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="1645" y="657" text-anchor="middle" class="pill" fill="#4338ca">NO GT IN PREDICTED INFERENCE</text>

  <text x="70" y="713" class="subtitle">Current scope: prepared graph/cloud inputs · Pose/SLAM and raw RGB-D replay are deferred to a later product stage</text>
</svg>
