%YAML:1.0
---
# Conservative geometry-only settings for RGB-D point clouds. The upstream
# bundled bunny PCD has no appearance field, so appearance is explicitly off.
l_init: 0.15
l_min: 0.03
amplitude: 0.1
sparsity_cutoff: 0.0001
c_l: 0.05
c_amplitude: 1.0
max_iterations: 300
tol: 0.00005
tol_2: 0.000012
max_neighbors: 64
l_decay_rate: 0.7
l_decay_start: 10
indicator_window: 30
indicator_threshold: 0.001
use_geometry: 1
use_features: 0
use_kdtree: 0
kernel_type: 0
kernel_eval_max_dist: 0.5
verbose: 0
use_ema_indicator: 1
